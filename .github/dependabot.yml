version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # 公開直後のリリースは拾わない。patch / minor は人が見ないまま本番へ出るため、
    # 乗っ取られた版が取り下げられるまでの猶予を挟む。
    #
    # semver-*-days は bun エコシステムでは効かない（NPM / Yarn などのみ）ので
    # default-days で一律に置く
    cooldown:
      default-days: 5
    # 更新の種類ごとに分ける。全部を 1 本の PR にまとめない。
    #
    # まとめると 1 パッケージが落ちただけで他の更新まで止まり、原因の切り分けに
    # 二分探索が要る。種類で分かれていれば、自動マージの対象（patch / minor）と
    # 人が読む対象（major）も PR 単位でそのまま一致する
    groups:
      patch:
        update-types:
          - "patch"
      minor:
        update-types:
          - "minor"
      major:
        update-types:
          - "major"
