name: Dependabot Auto Merge

on:
  pull_request:
    branches: [main]

# メタデータの取得にしか GITHUB_TOKEN を使わない。マージは GitHub App で行う（下記）
permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}

      # patch と minor まで。CI は実データで 85 ページを書き出し、HTML 内の参照が
      # 全て解決することまで見ているため、この範囲の回帰はここで落ちる。
      #
      # major は自動化しない。破壊的変更こそ人が変更点を読むべきで、頻度も低い
      - name: Auto merge patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge "$PR_URL" --auto --merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
